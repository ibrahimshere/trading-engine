[project]
name = "longterm-research"
version = "0.1.0"
description = "Long-term portfolio research tools for daily ETF/equity data and allocation simulations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longterm_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
